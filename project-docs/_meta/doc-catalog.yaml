# 文档目录索引（doc-catalog）
#
# 这份文件是「本工程已启用文档目录索引」的标志。没有它，retire-docs 会整体拒绝执行，
# save-* 系列技能的索引维护步骤会静默空转（工具退 0 但 stdout 打 "skipped": true）。
#
# 写入纪律（强制）：
#   - 只能由 sentra-catalog-upsert.py 逐条写，禁止手工整体重写。
#     这是多写者共享的聚合文件，整体重写会把别的链路刚落的条目一起抹掉。
#   - 顶层 `documents:` 必须顶格且独占一行，条目以 "  - id: " 起始、字段缩进 4 空格。
#     格式不符会被解析器当结构错拒绝。
#   - updated_at 由工具每次写入时自动刷新，无需手工维护。
#
# 字段取值（封闭全集）：
#   status    : draft / approved / active / completed / superseded
#   canonical : true / false
#   type      : product / iteration-design / iteration-plan / iteration-acceptance /
#               domain / report / fix-issue / decision / learning / deploy / handoff / archive
#
# 不登记的两类（治理协议 §12.1 规则 A / A2）：
#   iterations/ 下的实施计划类（type=iteration-plan）与验收类（type=iteration-acceptance）
