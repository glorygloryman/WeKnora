directories:
  - path: project-docs/product
    type: product
    purpose: L0 产品契约长生命单例（总体需求/权限矩阵/整体实施计划/api-设计/数据字典/流程图）
  - path: project-docs/iterations
    type: iteration-design
    purpose: L2 迭代过程目录（<主题>/，含二次设计 / 详细实施计划 / 验收）
  - path: project-docs/domain
    type: domain
    purpose: L1 业务领域知识（不依赖技术栈的概念模型、业务规则）
  - path: project-docs/decisions
    type: decision
    purpose: L1 设计决策（含外部技术栈版本限制的应对决策）
  - path: project-docs/learnings
    type: learning
    purpose: L1 可复用技巧/经验/实现模式/排查思路
  - path: project-docs/fix-issue
    type: fix-issue
    purpose: L1 真实故障复盘与规避准则
  - path: project-docs/reports
    type: report
    purpose: L3 时间序列：评审、验收与分析报告
  - path: project-docs/handoff
    type: handoff
    purpose: L3 时间序列：交接、停留点
  - path: project-docs/deploy
    type: deploy
    purpose: 部署、环境、发版、运维、迁移落盘
  - path: project-docs/archive
    type: archive
    purpose: 废弃方案、早期参考资料与退役归档
notes:
  - 本索引由 init-sentra-memory 播种为空骨架，条目从第一次文档沉淀开始逐条累积。
  - 骨架刚建好时 documents 为空，此时 retire-docs 扫描返回空候选属正常，不是失败。
